name: Integration

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gen/go/go.mod
          cache-dependency-path: gen/go/go.sum

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint and format
        run: |
          uv run --locked ruff check
          uv run --locked ruff format --check

      - name: Check generated bindings
        run: |
          uv run --locked python scripts/generate.py --check
          uv run --locked python scripts/generate.py --go --check

      - name: Test Python service
        run: uv run --locked pytest

      - name: Test Go client against Python
        run: uv run --locked python scripts/test_go.py
