name: Integration

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Setup Buf
        uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: 1.73.0
          setup_only: true
          token: ${{ secrets.BUF_TOKEN }}

      - name: Lint and format
        run: |
          buf lint
          buf format --diff --exit-code --path proto/fanscore/optimizer
          uv run --locked ruff check
          uv run --locked ruff format --check

      - name: Check generated bindings
        run: |
          generated="$(mktemp -d)"
          trap 'rm -rf "$generated"' EXIT
          buf generate --output "$generated"
          diff -ru -x __pycache__ src/fanscore/optimizer/v1 "$generated/src/fanscore/optimizer/v1"

      - name: Check protobuf compatibility
        run: buf breaking --exclude-imports --against buf.build/fanscore-ch/optimizer:main

      - name: Test
        run: uv run --locked pytest
