// Defines the request, response, and gRPC service for executing OR-Tools CP-SAT models.
syntax = "proto3";

package fanscore.optimizer.v1;

import "ortools/sat/cp_model.proto";
import "ortools/sat/sat_parameters.proto";

// Executes caller-defined OR-Tools CP-SAT models within server resource limits.
service OptimizerService {
  // Solves a caller-defined model. No application data is loaded or persisted.
  rpc Solve(SolveRequest) returns (SolveResponse);
}

// A CP-SAT model and optional solver parameters for a single solve.
message SolveRequest {
  // Required. Variable indexes in the response refer to this model's variables.
  operations_research.sat.CpModelProto model = 1;

  // Optional. Supported fields: max_time_in_seconds, max_deterministic_time,
  // num_workers, random_seed, stop_after_first_solution,
  // relative_gap_limit, absolute_gap_limit. Other fields are rejected.
  // Solve time is capped by server configuration and the remaining RPC deadline.
  // Worker count is capped by server configuration.
  operations_research.sat.SatParameters parameters = 2;
}

// The solver's status, solution, and execution statistics.
message SolveResponse {
  // Includes OPTIMAL, FEASIBLE, INFEASIBLE, MODEL_INVALID, or UNKNOWN.
  // A solution may only be consumed for OPTIMAL or FEASIBLE.
  operations_research.sat.CpSolverResponse result = 1;
}
