[project]
name = "fanscore-optimizer"
version = "0.1.0"
description = "Stateless gRPC runtime for OR-Tools CP-SAT models"
requires-python = ">=3.14,<3.15"
dependencies = [
  "grpcio>=1.81.1,<1.85",
  "grpcio-health-checking>=1.81.1,<1.82",
  "grpcio-status>=1.81.1,<1.82",
  "googleapis-common-protos>=1.72,<2",
  "ortools==9.15.6755",
]

[project.scripts]
optimizer = "optimizer.main:main"
optimizer-health = "optimizer.health:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optimizer", "src/fanscore"]

[dependency-groups]
dev = [
  "pytest>=9.1,<10",
  "ruff>=0.16,<0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
extend-exclude = ["src/fanscore"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
